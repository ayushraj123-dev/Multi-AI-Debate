<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Debate Arena</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #050816, #0a0f2c, #101b45);
      color: white;
      padding: 30px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .title {
      text-align: center;
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #7df9ff;
      text-shadow: 0 0 20px rgba(125, 249, 255, 0.6);
    }

    .subtitle {
      text-align: center;
      color: #b8c7ff;
      margin-bottom: 35px;
      font-size: 16px;
    }

    .input-box {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
    }

    input {
      flex: 1;
      padding: 18px;
      border: 1px solid rgba(125, 249, 255, 0.3);
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
      color: white;
      font-size: 16px;
      outline: none;
      backdrop-filter: blur(10px);
    }

    input::placeholder {
      color: #9fb3ff;
    }

    button {
      padding: 18px 28px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(90deg, #00e5ff, #7c4dff);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 20px rgba(0,229,255,0.25);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0,229,255,0.4);
    }

    .chat-box {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 25px;
      backdrop-filter: blur(14px);
      min-height: 300px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    }

    .message {
      background: rgba(255,255,255,0.06);
      border-left: 4px solid #00e5ff;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 18px;
      line-height: 1.6;
    }

    .round {
      font-size: 14px;
      color: #7df9ff;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .reply {
      color: #dfe7ff;
      white-space: pre-wrap;
    }

    .judge {
      border-left: 4px solid #ffd700;
      background: rgba(255, 215, 0, 0.08);
    }

    .loading {
      text-align: center;
      color: #7df9ff;
      font-size: 18px;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="title">🔥 AI Debate Arena</div>
    <div class="subtitle">5 AI Minds • Multi-Round Debate • Final AI Judge 👑</div>

    <div class="input-box">
      <input
        type="text"
        id="topic"
        placeholder="Enter a debate topic (example: Is AI dangerous for humanity?)"
      />
      <button onclick="startDebate()">Start Debate</button>
    </div>

    <div class="chat-box" id="chat">
      
    </div>
  </div>

  <script>
    async function startDebate() {
      const topic = document.getElementById("topic").value.trim();
      const chat = document.getElementById("chat");

      if (!topic) {
        alert("Please enter a debate topic first.");
        return;
      }

      chat.innerHTML = `<div class="loading">⚡ AI systems are preparing arguments...</div>`;

      try {
        const response = await fetch("/start_debate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ topic })
        });

        const data = await response.json();

        if (data.error) {
          chat.innerHTML = `<div class="message">⚠ ${data.error}</div>`;
          return;
        }

        chat.innerHTML = "";

        data.responses.forEach(item => {
          const isJudge = item.name.includes("Judge");

          const div = document.createElement("div");
          div.className = isJudge ? "message judge" : "message";

          div.innerHTML = `
            <div class="round">${item.round}</div>
            <div class="name">${item.name}</div>
            <div class="reply">${item.reply}</div>
          `;

          chat.appendChild(div);
        });

      } catch (error) {
        chat.innerHTML = `<div class="message">⚠ Failed to start debate</div>`;
        console.error(error);
      }
    }
  </script>

</body>
</html>
